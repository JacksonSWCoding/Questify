<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questify</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <script src="/static/shop.js" defer></script>
</head>
<body>
    <header class="hero-header">
        <h1 class="game-title">Questify</h1>
        <p class="game-subtitle">Turn Your Goals Into an Adventure</p>
    </header>

    <div class="app-container">
        <!-- LEFT PANEL: Task System -->
        <section class="task-panel">
            <h2>Today's Quests</h2>
            <div class="input-group">
                <input type="text" id="task-input" placeholder="Enter a new quest...">
                <select id="task-category">
                    <option value="general">📋 General</option>
                    <option value="fitness">🏃 Fitness</option>
                    <option value="coding">💻 Coding</option>
                    <option value="creative">🎨 Creative</option>
                </select>
                <button id="add-btn">Accept Quest</button>
            </div>
            <ul id="task-list"></ul>
        </section>

        <!-- RIGHT PANEL: Character Window -->
        <section class="character-panel">
            <h2>Your Hero</h2>
            <div id="character-display">
                <div class="character-stage" data-trait="general">
                  <div class="character-rig">
                    <!-- Base Character Body & Outfit Layers Stacked Directly Together -->
                    <div id="base-avatar" class="lpc-sprite sprite-male"></div>
                    <div id="outfit-layer" class="lpc-sprite sprite-outfit-male"></div>
                  </div>
                </div>

                <p id="dominant-trait" class="dominant-trait">Dominant trait: General</p>
                <p id="unlock-message" class="unlock-message" role="status"></p>

                <div class="xp-bars">
                    <div class="xp-row">
                        <span class="xp-label">🏃 Fitness</span>
                        <div class="xp-track"><div id="fitness-xp-bar" class="xp-fill"></div></div>
                        <span id="fitness-xp-text" class="xp-text">0 / 10 XP</span>
                    </div>
                    <div class="xp-row">
                        <span class="xp-label">💻 Coding</span>
                        <div class="xp-track"><div id="coding-xp-bar" class="xp-fill"></div></div>
                        <span id="coding-xp-text" class="xp-text">0 / 10 XP</span>
                    </div>
                    <div class="xp-row">
                        <span class="xp-label">🎨 Creative</span>
                        <div class="xp-track"><div id="creative-xp-bar" class="xp-fill"></div></div>
                        <span id="creative-xp-text" class="xp-text">0 / 10 XP</span>
                    </div>
                </div>

                <div id="unlocked-gear-list" class="unlocked-gear"></div>
            </div>

            <button id="shop-button" class="ui-button shop-corner-btn">🛍️ Shop</button>
            <button id="customize-btn" class="ui-button customize-corner-btn">⚙️ Customize</button>
        </section>
    </div>

    <!-- CUSTOMIZATION MODAL -->
    <div id="customizer-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <h2>Character Customization</h2>
        <div class="custom-group">
          <label>Base Model:</label>
          <div class="gender-toggle">
            <button type="button" class="gender-btn active" data-gender="male">Male</button>
            <button type="button" class="gender-btn" data-gender="female">Female</button>
          </div>
        </div>
        <hr style="border-color: #3b4252; margin: 20px 0;">
        <div class="custom-group">
          <label style="color: #bf616a;">Danger Zone:</label>
          <button id="reset-progress-btn" class="danger-btn">Reset Hero Progress</button>
        </div>
        <div class="modal-actions" style="margin-top: 20px;">
          <button id="save-customization-btn" class="primary-btn">Save Changes</button>
          <button id="close-modal-btn" class="secondary-btn">Cancel</button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="/static/evolution.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
