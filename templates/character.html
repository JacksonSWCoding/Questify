

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPG Character Panel</title>
    <link rel="stylesheet" href="/static/css/character.css">
</head>

<body>

    <section id="character-panel">
        <h2>Your Hero</h2>

        <div class="character-info">
            <h3 id="character-name">Adventurer</h3>
            <p>Level <span id="character-level">1</span></p>
        </div>

        <div class="character-display">
            <img
                id="character-image"
                src="/static/images/beginner.png"
                alt="Your RPG character"
            >
        </div>

        <div class="xp-container">
            <p>Experience Points</p>

            <div class="xp-bar">
                <div id="xp-fill"></div>
            </div>

            <p id="xp-text">0 / 100 XP</p>
        </div>

        <div class="equipment-container">
            <h3>Equipment</h3>
            <p id="equipment-name">Basic Gear</p>
            <p id="next-unlock">Next Unlock: Iron Sword</p>
        </div>
    </section>

</body>
</html>
